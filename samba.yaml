version: "3.8"
services:
  samba:
    container_name: samba-share
    image: joebiellik/samba-server
    restart: unless-stopped
    volumes:
      - /docker/samba/smb.conf:/etc/samba/smb.conf
      - /docker:/share/docker
    ports:
      - 137:137/udp
      - 138:138/udp
      - 139:139/tcp
      - 445:445/tcp
    environment:
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
volumes: {}
networks: {}
