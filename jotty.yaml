services:
  jotty:
    image: ghcr.io/fccview/jotty:latest
    container_name: jotty
    user: "1000:1000"
    ports:
      - "1122:3000"
    volumes:
      - /docker/jotty/data:/app/data:rw
      - /docker/jotty/config:/app/config:rw
      - /docker/jotty/cache:/app/.next/cache:rw
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SSO_MODE=oidc
      - OIDC_ISSUER=https://login.${DOMAIN}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - APP_URL=https://${APP_URL} # if not set defaults to http://localhost:<port>
      # Optional security enhancements:
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET} # Enable confidential client mode (if your provider requires it)
      - SSO_FALLBACK_LOCAL=no # Allow both SSO and local login
      - OIDC_ADMIN_GROUPS=admin # Map IDP groups claim to admin role
      - OIDC_ADMIN_ROLES=admin # Map IDP roles claim to admin role
      - OIDC_USER_GROUPS=family # Restrict access to users in these groups (admins always allowed)
      - OIDC_USER_ROLES=family # Restrict access to users with these roles (admins always allowed)
      - OIDC_GROUPS_SCOPE=groups # Scope to request for groups (set to empty string or "no" to disable for providers like Entra ID)
      #- OIDC_LOGOUT_URL=https://authprovider.local/realms/master/logout # Custom logout URL for global logout
      # Optional for reverse proxy issues:
      # - INTERNAL_API_URL=http://localhost:3000 # Use if getting 403 errors after SSO login
  jotty-mcp-server:
    image: git.jreed.me/JReed/jotty-mcp-server:latest
    container_name: jotty-mcp-server
    environment:
      - STARTER_TRANSPORT=http
      - PORT=3000
      - CORS_ORIGIN=*
      - JOTTY_BASE_URL=http://jotty
      - JOTTY_API_KEY=${JOTTY_API_KEY}
      - API_KEY=${API_KEY}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
